name: CI Verify (semantic-router)

on:
  push:
    branches: ["ci/gha-verify"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Clone upstream source
        run: git clone --depth=1 --branch main https://github.com/vllm-project/semantic-router.git source
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/src/semantic-router/go.mod
          cache: true
          cache-dependency-path: source/src/semantic-router/go.sum
      - name: Build router
        working-directory: source
        run: make build
      - name: Show artifacts
        working-directory: source
        run: |
          find . -maxdepth 3 -type f -perm -u+x -name "*router*" | head -20
          ls -lh bin 2>/dev/null || true
